name: Semantic release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Calculate and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run semantic-release version
      - name: Dispatch package publishing for a new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ -n "$tag" ]; then
            gh workflow run publish.yml --repo "${{ github.repository }}" --ref "$tag"
          else
            echo "No new release tag was created; skipping package publishing."
          fi
